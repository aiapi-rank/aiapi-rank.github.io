name: Publish pages
on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      data_ref:
        description: 'Public data repository branch or commit (default main)'
        type: string
        default: main
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'aiapi-rank/aiapi-rank.github.io' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.PUBLIC_DISTRIBUTION_ENABLED == 'true')
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Require pinned tooling revision
        env:
          TOOLING_REF: ${{ vars.FOLKBENCH_TOOLING_SHA }}
        run: test "${#TOOLING_REF}" -eq 40 && [[ "$TOOLING_REF" =~ ^[a-f0-9]+$ ]]
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: Folkbench/folkbench
          ref: ${{ vars.FOLKBENCH_TOOLING_SHA }}
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: Folkbench/folkbench-data
          ref: ${{ inputs.data_ref || 'main' }}
          path: data
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Generate and validate pages
        env:
          BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}
          BAIDU_SITE_VERIFICATION: ${{ vars.BAIDU_SITE_VERIFICATION }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
        run: bun tooling/scripts/distribution/cli.ts subsite --site aiapi-rank --data-root data --out dist
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
